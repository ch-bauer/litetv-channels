<!DOCTYPE html>
<html>
<head>
    <title>LiteTV</title>
</head>
<body>
    <!--
        The configuration page is now an app, built by Vite in web/ and embedded in the plugin;
        this file only mounts it. Everything it used to be is still here as configPage.legacy.html
        and reachable from the notice below, until the new one has been lived with.

        Why an app at all: the old page was one very large hand-written file wearing the
        dashboard's own components, and most of what was wrong with it was wrong because of that.
        The theme, the component upgrade and the 803px form cap all had opinions, and fighting
        them is what made the page diverge from its design.
    -->
    <div id="litetvConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div class="content-primary">
            <div id="litetv-app"></div>

            <div id="litetvBundleMissing" style="display: none; padding: 1.5em; color: #e08585;">
                <p style="max-width: 44em;">
                    <strong>The configuration app is not in this build.</strong>
                    It is built by Vite from <code>web/</code> and embedded at package time; a
                    plugin built without running that step compiles and installs perfectly happily
                    with no page inside it, which is why this says so rather than showing nothing.
                </p>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            var page = document.querySelector('#litetvConfigPage');

            // Each visit loads the module under its own query string. A module URL is evaluated
            // ONCE per document, so re-adding the same src after a viewhide would append a tag
            // that never runs - the page would work the first time and be blank on every return
            // to it. The bundle is served no-store anyway, so nothing is being defeated here.
            var visit = 0;

            // Where the plugin serves its own bundle. Both files keep stable names precisely so
            // this file can name them; everything else in the bundle is content-hashed.
            function url(file) {
                var u = ApiClient.getUrl('LiteTv/Web/' + file);
                return u + (u.indexOf('?') === -1 ? '?' : '&') + 'v=' + visit;
            }

            function showMissing() {
                var notice = page.querySelector('#litetvBundleMissing');
                if (notice) { notice.style.display = 'block'; }
            }

            function show() {
                // Both events are listened for, so this must be idempotent. It also guards the
                // case of a show arriving without an intervening hide.
                if (page.getAttribute('data-litetv-loaded') === 'yes') { return; }
                page.setAttribute('data-litetv-loaded', 'yes');
                visit++;

                var css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = url('litetv.css');
                css.id = 'litetvAppCss';
                document.head.appendChild(css);

                var script = document.createElement('script');
                script.type = 'module';
                script.src = url('litetv.js');
                script.id = 'litetvAppJs';
                script.onerror = showMissing;
                document.head.appendChild(script);
            }

            function hide() {
                if (page.getAttribute('data-litetv-loaded') !== 'yes') { return; }
                page.removeAttribute('data-litetv-loaded');

                // Let Svelte take its own effects down. Clearing the host would orphan them.
                if (typeof window.__litetvUnmount === 'function') {
                    try { window.__litetvUnmount(); } catch (e) { console.error('[litetv]', e); }
                }
                delete window.__litetvUnmount;

                ['litetvAppCss', 'litetvAppJs'].forEach(function (id) {
                    var node = document.getElementById(id);
                    if (node && node.parentNode) { node.parentNode.removeChild(node); }
                });
                var host = page.querySelector('#litetv-app');
                if (host) { host.innerHTML = ''; }
            }

            // BOTH names, and this is not belt-and-braces. This dashboard fires `pageshow` - the
            // page that worked for seventy releases listened for exactly that - while `viewshow`
            // is the newer name and fires in other versions. Listening for only `viewshow` is
            // what shipped in 1.0.70.0, and the result was a blank page with nothing able to say
            // why: no handler ran, so no script tag was ever made, so `onerror` could never fire
            // either. A lifecycle whose name changed between versions has to be met halfway.
            page.addEventListener('pageshow', show);
            page.addEventListener('viewshow', show);
            page.addEventListener('pagehide', hide);
            page.addEventListener('viewhide', hide);
        })();
    </script>
</body>
</html>
