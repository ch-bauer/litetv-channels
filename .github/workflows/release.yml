name: Release

on:
  push:
    tags: ['v*']
  # So a release can be re-cut without moving a tag - and so that "did Actions run?" is a
  # question that can be answered on purpose rather than by pushing another tag. Dispatch it
  # against the tag itself (`gh workflow run release.yml --ref v1.2.3`): every step below reads
  # GITHUB_REF_NAME, which is the tag's name either way.
  workflow_dispatch:

permissions:
  contents: write

# Two tags may be pushed close together. The release assets can build independently, but their
# checksum commits both touch manifest.json, so serialize that one shared follow-up.
concurrency:
  group: litetv-release-and-manifest
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag is the only version this workflow trusts, but meta.json is copied into the
      # package unchecked - and meta.json is what Jellyfin reads for the installed version.
      # 1.0.123.0 shipped that way: manifest.json and the csproj were bumped, meta.json was not,
      # and the published package reported 1.0.122.0 with nothing failing anywhere. So check the
      # places that must agree before a build is spent on them. Only from a tag: dispatching
      # against a branch is for building and testing, and GITHUB_REF_NAME is a branch name there.
      - name: Check every version agrees with the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ=src/Jellyfin.Plugin.LiteTv/Jellyfin.Plugin.LiteTv.csproj
          fail=0

          agrees() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 says '$2', the tag says '$VERSION'."
              fail=1
            fi
          }

          # sed, not grep -oP: PCRE is a build option and refuses to run under some locales.
          tag_value() { sed -n "s|.*<$1>\([^<]*\)</$1>.*|\1|p" "$CSPROJ" | head -1; }

          agrees "meta.json version" "$(jq -r '.version' meta.json)"
          agrees "$CSPROJ AssemblyVersion" "$(tag_value AssemblyVersion)"
          agrees "$CSPROJ FileVersion" "$(tag_value FileVersion)"

          # The checksum step already requires this entry, but only after the release is public.
          # Finding it missing here costs a failed run instead of a published one.
          ENTRIES="$(jq --arg v "$VERSION" '[.[].versions[] | select(.version == $v)] | length' manifest.json)"
          if [ "$ENTRIES" != "1" ]; then
            echo "::error::manifest.json holds $ENTRIES entries for $VERSION, expected exactly 1."
            fail=1
          else
            META_ABI="$(jq -r '.targetAbi' meta.json)"
            ENTRY_ABI="$(jq -r --arg v "$VERSION" 'first(.[].versions[] | select(.version == $v) | .targetAbi)' manifest.json)"
            if [ "$META_ABI" != "$ENTRY_ABI" ]; then
              echo "::error::targetAbi disagrees - meta.json '$META_ABI', manifest.json '$ENTRY_ABI'."
              fail=1
            fi
          fi

          test "$fail" = 0
          echo "meta.json, the csproj and manifest.json all say $VERSION."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The configuration app. web/dist is not in git - it is built here, and the csproj embeds
      # whatever this step leaves behind. So this MUST run before dotnet publish: skip it and
      # the plugin still compiles, still packages and still installs, and simply has no
      # configuration page inside it. That silence is the whole reason for the guard below.
      - name: Build the configuration app
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Check the bundle is really there
        run: |
          test -f web/dist/litetv.js || {
            echo "::error::web/dist/litetv.js is missing - the plugin would ship with no configuration page."
            exit 1
          }
          echo "Bundle contents:"
          ls -la web/dist

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.LiteTv.Tests

      - name: Build
        run: dotnet publish src/Jellyfin.Plugin.LiteTv -c Release -o publish

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf package
          mkdir -p package
          test -f publish/Jellyfin.Plugin.LiteTv.dll
          test -f meta.json
          cp publish/Jellyfin.Plugin.LiteTv.dll package/
          cp meta.json package/
          zip -q -j "litetv-channels_${VERSION}.zip" package/Jellyfin.Plugin.LiteTv.dll package/meta.json
          test -s "litetv-channels_${VERSION}.zip"
          echo "MD5 checksum for manifest.json:"
          md5sum "litetv-channels_${VERSION}.zip"

      # Only ever from a tag. Dispatched against a branch this step would publish a release
      # called "main" holding litetv-channels_main.zip, which is exactly what happened the
      # first time the dispatch was tried - it was caught mid-run. Building and testing on a
      # branch is useful; publishing from one never is.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: litetv-channels_*.zip
          generate_release_notes: true

      # The release ZIP is the only trustworthy checksum source. The tag itself must remain
      # immutable, so record the value in main after publishing rather than trying to amend the
      # tag. Future updater checks therefore need no manual follow-up at all.
      - name: Record package checksum in the updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          PACKAGE="litetv-channels_${VERSION}.zip"
          CHECKSUM="$(md5sum "$PACKAGE" | awk '{print $1}')"
          test -n "$CHECKSUM"

          git fetch origin main
          git checkout -B main origin/main
          test "$(jq --arg version "$VERSION" '[.[].versions[] | select(.version == $version)] | length' manifest.json)" = "1"
          jq --arg version "$VERSION" --arg checksum "$CHECKSUM" \
            'map(.versions |= map(if .version == $version then .checksum = $checksum else . end))' \
            manifest.json > manifest.next.json
          mv manifest.next.json manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Record ${VERSION} package checksum"
          git push origin HEAD:main
